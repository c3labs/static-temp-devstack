<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8">
		<link rel="icon" href="%sveltekit.assets%/c3_favicon.png" type="image/png">
		<link rel="icon" href="%sveltekit.assets%/c3_favicon.svg" type="image/svg+xml">
		<link rel="apple-touch-icon" sizes="180x180" href="h%sveltekit.assets%/c3_apple-touch-icon.png">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="c3labs">
		<meta name="robots" content="index, follow">
		<meta property="og:site_name" content="c3labs | Büro für mediale Kommunikation">
		<meta property="og:type" content="Website">
		<meta property="og:url" content="https://c3labs.de">
		<meta property="og:image" content="https://c3labs.de/og/ogimage@2x.webp">
		<meta name="twitter:url" content="https://c3labs.de">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:image" content="https://c3labs.de/og/ogimage@2x.webp">


		<script>
			(function () {
				try {
					var k = 'theme';
					var stored = localStorage.getItem(k);
					var dark = stored
						? stored === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
